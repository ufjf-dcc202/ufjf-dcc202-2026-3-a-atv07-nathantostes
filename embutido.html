<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Em Linha</title>
    <style>
        em {
            color: orange;
            text-decoration: underline;
        }

        code {
            color: lime;
            text-decoration: underline;
        }

        li > code {
            color: white;
            background-color: black;
        }
    </style>
</head>

<body>
    <main>
        <h1>DCC202 CSS Em Linha</h1>
        <p>O estilo <em>em linha</em> é aplicado diretamente no
            elemento via atribute <code>style</code>.
        </p>
        <ol>
            <li><code>HELLO WORLD!</code></li>
            <li><code>2+2 = 4</code></li>
        </ol>
    </main>
</body>

</html>
